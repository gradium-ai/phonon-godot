# cargo-about configuration for THIRD_PARTY_NOTICES.md, which notices/generate.sh builds and CI
# puts in addons/phonon/. It covers every crate compiled into the shipped libraries, for all the
# targets the addon ships. Build scripts and proc macros run only at build time and are left out.

targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The licenses a crate may use, in order of preference when it offers a choice. Generation fails
# for a crate whose license is not covered, so a new license needs a look before it ships.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
]

# Known packaging problems of these crates, handled by cargo-about.
workarounds = ["ring", "rustls"]

# This addon itself: its license is LICENSE, next to the notices.
[private]
ignore = true
