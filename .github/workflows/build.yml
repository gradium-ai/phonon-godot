name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --check
      - run: cargo clippy --release --locked -- -D warnings

  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal library: Apple silicon and Intel, each with the features and CPU
          # baseline of the ptts release builds (see Cargo.toml and .cargo/config.toml).
          - platform: macos
            runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: linux
            runner: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - platform: windows
            runner: windows-2022
            targets: x86_64-pc-windows-msvc
    env:
      # The oldest macOS the ptts release builds are checked on.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target"
          done
      # xn turns the KleidiAI kernels off with a hidden warning when the toolchain cannot build
      # them, so check the build script's recorded output instead.
      - name: Check that the KleidiAI kernels are in the build
        if: matrix.platform == 'macos'
        run: |
          if ! grep -qs "cargo:rustc-cfg=xn_kai" target/aarch64-apple-darwin/release/build/xn-*/output; then
            echo "::error::the KleidiAI kernels did not build with this toolchain"
            exit 1
          fi
      - name: Stage the library
        shell: bash
        run: |
          set -euo pipefail
          out=staged/${{ matrix.platform }}
          mkdir -p "$out"
          case "${{ matrix.platform }}" in
            macos)
              lipo -create -output "$out/libphonon_godot.dylib" \
                target/aarch64-apple-darwin/release/libphonon_godot.dylib \
                target/x86_64-apple-darwin/release/libphonon_godot.dylib
              lipo -info "$out/libphonon_godot.dylib"
              codesign --force --sign - "$out/libphonon_godot.dylib"
              ;;
            linux)
              cp target/x86_64-unknown-linux-gnu/release/libphonon_godot.so "$out/libphonon_godot.x86_64.so"
              ;;
            windows)
              cp target/x86_64-pc-windows-msvc/release/phonon_godot.dll "$out/phonon_godot.x86_64.dll"
              ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}
          path: staged/${{ matrix.platform }}
          if-no-files-found: error

  notices:
    name: Third-party notices
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      # One file for every crate compiled into the libraries of all shipped platforms (the targets
      # are in about.toml). It fails when a crate's license is not in the accepted list there.
      - name: Generate THIRD_PARTY_NOTICES.md
        run: cargo about generate --locked --fail -c about.toml -o THIRD_PARTY_NOTICES.md notices/about.hbs
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  package:
    name: Package the addon
    needs: [lint, build, notices]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      zip: ${{ steps.zip.outputs.zip }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: lib-*
          path: libs
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: notices-out
      - name: Assemble addons/phonon
        run: |
          set -euo pipefail
          mkdir -p package/addons
          cp -R addons/phonon package/addons/phonon
          for platform in macos linux windows; do
            mkdir -p "package/addons/phonon/bin/$platform"
            cp "libs/lib-$platform"/* "package/addons/phonon/bin/$platform/"
          done
          cp notices-out/THIRD_PARTY_NOTICES.md package/addons/phonon/
          # The store wants the license inside the download, so the addon keeps a copy.
          cmp LICENSE addons/phonon/LICENSE || { echo "::error::addons/phonon/LICENSE differs from LICENSE"; exit 1; }
          # Every library the .gdextension file names must be in the package.
          grep -o 'res://addons/phonon/bin/[^"]*' addons/phonon/phonon.gdextension | sort -u |
            while read -r path; do test -f "package/${path#res://}" || { echo "::error::missing ${path}"; exit 1; }; done
          find package -type f | sort
      # phonon-godot-<version>.zip is what the Asset Store gets: addons/phonon/ at its root,
      # with nothing else in it.
      - name: Zip the addon
        id: zip
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          zip="phonon-godot-$version.zip"
          mkdir dist
          (cd package && zip -r -X -q "../dist/$zip" addons)
          unzip -Z1 "dist/$zip" > contents.txt
          if grep -v '^addons/phonon/' contents.txt | grep -v '^addons/$' ||
             grep -E '(^|/)(\.DS_Store|__MACOSX|\.git[^/]*|Thumbs\.db)(/|$)' contents.txt; then
            echo "::error::unexpected files in $zip"
            exit 1
          fi
          # The store takes at most 1 GB per version.
          test "$(stat -c %s "dist/$zip")" -lt 1000000000
          ls -l dist
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      # The artifact's zip holds addons/phonon/ at its root, ready to extract into a project.
      - uses: actions/upload-artifact@v7
        with:
          name: phonon-godot-addon
          path: package
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: phonon-godot-zip
          path: dist/${{ steps.zip.outputs.zip }}
          if-no-files-found: error

  test-zip:
    name: Test the zip / ${{ matrix.platform }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            godot: Godot_v4.7.2-stable_linux.x86_64.zip
          - platform: windows
            runner: windows-2022
            godot: Godot_v4.7.2-stable_win64.exe.zip
          - platform: macos
            runner: macos-15
            godot: Godot_v4.7.2-stable_macos.universal.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: phonon-godot-zip
          path: dist
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/${{ matrix.godot }}"
          unzip -q godot.zip -d godot
          case "$RUNNER_OS" in
            Linux) godot=$(find godot -name 'Godot_*' -type f | head -n 1); chmod +x "$godot" ;;
            Windows) godot=$(find godot -name '*_console.exe' | head -n 1) ;;
            macOS) godot=godot/Godot.app/Contents/MacOS/Godot ;;
          esac
          echo "GODOT=$PWD/$godot" >> "$GITHUB_ENV"
      # A new project with the zip extracted into it, as a user of the store would have.
      - name: Install the zip into a new project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/tests
          printf 'config_version=5\n\n[application]\n\nconfig/name="Phonon Zip Test"\n' > project/project.godot
          unzip -q dist/*.zip -d project
          cp demo/tests/smoke_test.gd project/tests/
          # The first import of a new project with a GDExtension can crash while Godot exits,
          # after the import has finished, so only the second one has to succeed.
          "$GODOT" --headless --path project --import || true
          "$GODOT" --headless --path project --import
      - name: Run the smoke test
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/out"
          if [ "$RUNNER_OS" = Windows ]; then out=$(cygpath -m "$out"); fi
          "$GODOT" --headless --path project --script res://tests/smoke_test.gd -- "$out"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-${{ matrix.platform }}
          path: out
          if-no-files-found: ignore

  release:
    name: Draft the GitHub release
    needs: [package, test-zip]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: phonon-godot-zip
          path: dist
      - name: Attach the zip to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ needs.package.outputs.zip }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ZIP" --clobber
          else
            gh release create "$TAG" "dist/$ZIP" --verify-tag --draft --title "Phonon for Godot ${TAG#v}" \
              --notes "$ZIP is the addon for the Godot Asset Store: addons/phonon/ with the libraries for macOS, Linux x86_64 and Windows x86_64."
          fi
