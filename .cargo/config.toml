# Fixed CPU baselines, as the ptts release builds use. Never `target-cpu=native`: these
# libraries ship to players' machines. x86_64 needs AVX2 (x86-64-v3).
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static"]
